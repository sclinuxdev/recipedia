[package]
name = "recipedia"
version = "0.1.0"
edition = "2021"
description = "sclinux recipe & repository hub"
license = "BSD-2-Clause"
repository = "https://github.com/sclinuxdev/recipedia"

[dependencies]
anyhow = "1"
askama = "0.14"
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
ureq = "2"
zstd = "0.13"

[[bin]]
name = "recipedia-server"
path = "src/bin/server.rs"

[[bin]]
name = "recipedia"
path = "src/bin/recipedia.rs"

[lib]
name = "recipedia"
path = "src/lib.rs"
