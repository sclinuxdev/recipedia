[package]
name = "recipedia"
version = "0.1.0"
edition = "2021"
description = "ShenChen Linux recipe & repository hub"

[dependencies]
anyhow = "1"
askama = "0.14"
axum = "0.8"
hex = "0.4"
hmac = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.9"

[[bin]]
name = "recipedia-server"
path = "src/bin/server.rs"

[lib]
name = "recipedia"
path = "src/lib.rs"
