<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Recipedia{% endblock %} · sclinux</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d2228; --muted: #6b7280;
    --line: #d9d6cf; --link: #1a5dab; --accent: #35772f;
    --st-built: #2f7d32; --st-missing: #8a8f98; --st-outdated: #b26a00; --st-ahead: #b3362c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, "Segoe UI", "Noto Sans SC", sans-serif; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header.site { background: var(--panel); border-bottom: 2px solid var(--ink); }
  header.site .inner { max-width: 1100px; margin: 0 auto; padding: 14px 20px;
                       display: flex; align-items: baseline; gap: 22px; }
  header.site .brand { font-size: 21px; font-weight: 700; letter-spacing: .2px; }
  header.site .brand span { color: var(--accent); }
  header.site nav a { margin-right: 14px; font-weight: 500; }
  main { max-width: 1100px; margin: 0 auto; padding: 22px 20px 60px; }
  h1 { font-size: 19px; margin: 0 0 14px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .8px;
       color: var(--muted); margin: 26px 0 8px; }
  table { border-collapse: collapse; width: 100%; background: var(--panel);
          border: 1px solid var(--line); }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line);
           font-size: 14px; vertical-align: top; }
  th { background: #efede8; font-weight: 600; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  td.mono, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  td.muted { color: var(--muted); }
  .badge { display: inline-block; padding: 0 8px; border-radius: 9px;
           font-size: 12px; font-weight: 600; color: #fff; }
  .st-built { background: var(--st-built); }
  .st-missing { background: var(--st-missing); }
  .st-outdated { background: var(--st-outdated); }
  .st-ahead { background: var(--st-ahead); }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .stat { background: var(--panel); border: 1px solid var(--line); padding: 10px 16px;
          min-width: 110px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  form.filters { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; }
  form.filters input, form.filters select { padding: 5px 8px; border: 1px solid var(--line);
          background: var(--panel); font: inherit; }
  pre.recipe { background: var(--panel); border: 1px solid var(--line); padding: 12px;
               overflow-x: auto; font-size: 13px; line-height: 1.45; }
  footer { max-width: 1100px; margin: 0 auto; padding: 0 20px 30px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header class="site"><div class="inner">
  <div class="brand">Reci<span>pedia</span></div>
  <nav>
    <a href="/">Home</a>
    <a href="/packages">Packages</a>
    <a href="/status">Build Status</a>
    <a href="/upload">Upload</a>
  </nav>
  <div style="margin-left:auto" class="muted">sclinux · recipes</div>
</div></header>
<main>{% block content %}{% endblock %}</main>
<footer>Recipedia serves the sclinuxdev/recipes tree read-only; the git repository is the single source of truth.</footer>
</body>
</html>
